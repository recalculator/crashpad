# Runs this repository's composite action (action.yml) against the storefront
# test fixture on every pull request and every push to main. It is a live
# self-test of the GitHub integration: check result, job summary, report
# artifact, and (on pull requests) the PR comment.
#
# Security model: `pull_request` (never `pull_request_target`), so PR code runs
# with the PR's own token. For fork PRs GitHub makes that token read-only: the
# check, summary, and artifact still work; only the PR comment is skipped.
name: Crashpad

on:
  pull_request:
  push:
    branches: [main] # baseline = the pushed commit's first parent

permissions:
  contents: read
  pull-requests: write # PR comment; GitHub downgrades this to read for fork PRs

jobs:
  crashpad:
    name: Crashpad database checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the baseline is read from Git history
      - uses: ./
        with:
          project: test/fixtures/storefront
          database-url: postgres://postgres:postgres@localhost:5432/postgres
