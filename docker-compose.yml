# Local PostgreSQL for Crashpad (matches the CI service container).
#   docker compose up -d
#   export CRASHPAD_DATABASE_URL=postgres://postgres:postgres@localhost:5433/postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
